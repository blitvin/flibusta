; Xdebug for the dev stack. Mounted over the image at
; /usr/local/etc/php/conf.d/zz-xdebug.ini, so changes need only a
; `docker compose restart php-fpm`, not a rebuild.

zend_extension=xdebug

; debug   - step debugging from VSCode
; develop - readable var_dump, stack traces on warnings
xdebug.mode=debug,develop

; "trigger" and not "yes" on purpose. This project is about request cost, and
; attaching the debugger to every request would distort exactly the timings you
; came here to measure. A session starts only when the request carries the
; XDEBUG_TRIGGER cookie/parameter - set it with the browser extension, or by
; appending ?XDEBUG_TRIGGER=1 to the URL.
;
; Switch to "yes" while chasing something that happens on a request you cannot
; easily add a parameter to (OPDS from a reader app, sendBeacon position saves).
xdebug.start_with_request=trigger

xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=VSCODE

; Maps container paths to the workspace. VSCode needs the mirror image of this
; in .vscode/launch.json, or breakpoints silently never bind.
; /application -> <repo>/application
; /tools       -> <repo>/tools

; Uncomment when the debugger will not connect - it says exactly why.
; xdebug.log=/cache/log/xdebug.log
; xdebug.log_level=7
