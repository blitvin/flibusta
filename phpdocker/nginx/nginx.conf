# A TLS-terminating proxy in front of this container (Cloudflare Tunnel, another
# reverse proxy) speaks plain HTTP to us but reports the reader's real scheme in
# X-Forwarded-Proto. Honour it, falling back to our own scheme when it is absent.
# Only the "connection is not secure" warning on the admin page reads this - no
# access decision depends on it, so a spoofed header gains an attacker nothing.
# This file is included from inside nginx's http{} block, where map belongs.
map $http_x_forwarded_proto $flibusta_fwd_proto {
    default     $scheme;
    "~*^https$" https;
}

server {
    listen 80 default;

    client_max_body_size 508M;

    access_log /var/log/nginx/application.access.log;


    root /application/public;
    index index.php;

    # try to serve file directly, fallback to index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    if (!-e $request_filename) {
        rewrite ^.*$ /index.php last;
    }

    location ~ \.php$ {
        add_header 'Content-Security-Policy' 'worker-src * blob:';
	
        include fastcgi_params;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        
        fastcgi_param REMOTE_ADDR            $remote_addr;
        fastcgi_param REQUEST_URI            $request_uri;
        fastcgi_param HTTP_HOST              $http_host;
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $flibusta_fwd_proto;
        fastcgi_param HTTP_USER_AGENT        $http_user_agent;  
        fastcgi_param PHP_AUTH_USER          $remote_user;
        fastcgi_param HTTP_AUTHORIZATION     $http_authorization;
    }
    
}
