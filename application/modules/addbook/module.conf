<?php
// addbook module — admin-only creation of local books.
// Admin access is enforced by checkLogin(isAdminPath()) before this file runs.
global $url;
global $webroot;

include(__DIR__ . '/bookformat.php');

// LOCAL_ID_BASE comes from init.php.

$url->title = 'Добавить';
$addbook_errors = [];
$addbook_dup_titles = [];

// module.conf runs BEFORE renderer.php's maintenance check, so any DB access
// here must take its own shared lock on DBUPDATE_LOCK (import holds it
// exclusively while truncating/reloading tables).
$addbook_dblock = fopen(DBUPDATE_LOCK, 'c');
$addbook_db_ok = ($addbook_dblock !== false) && flock($addbook_dblock, LOCK_SH | LOCK_NB);

function addbook_json($data, int $code = 200): void {
	http_response_code($code);
	header('Content-Type: application/json; charset=utf-8');
	echo json_encode($data, JSON_UNESCAPED_UNICODE);
	exit;
}

// ---------------------------------------------------------------------------
// AJAX: author search over ALL authors (including those without books) with
// trigram misspell tolerance. Regular library search keeps its hasBooks filter;
// this endpoint deliberately does not.
// ---------------------------------------------------------------------------
if ($url->action === 'authorsearch') {
	if (!$addbook_db_ok) addbook_json(['error' => 'maintenance'], 503);
	$q = trim((string)($_GET['q'] ?? ''));
	if (mb_strlen($q) < 2) addbook_json(['results' => []]);
	$stmt = $dbh->prepare("SELECT an.avtorid,
			trim(concat_ws(' ', an.lastname, an.firstname, an.middlename, nullif(an.nickname,''))) AS name,
			(SELECT COUNT(*) FROM libavtor la JOIN libbook lb ON lb.bookid = la.bookid
			 WHERE la.avtorid = an.avtorid AND lb.deleted = '0') AS cnt,
			(an.avtorid >= " . LOCAL_ID_BASE . ") AS islocal,
			GREATEST(similarity(an.lastname, :q1),
			         similarity(an.lastname || ' ' || an.firstname || ' ' || an.middlename || ' ' || an.nickname, :q2)) AS sim
		FROM libavtorname an
		WHERE (an.lastname || ' ' || an.firstname || ' ' || an.middlename || ' ' || an.nickname) % :q3
		   OR an.lastname ILIKE :qpfx
		ORDER BY sim DESC, an.lastname, an.firstname
		LIMIT 15");
	$stmt->execute([':q1' => $q, ':q2' => $q, ':q3' => $q, ':qpfx' => $q . '%']);
	$results = [];
	while ($r = $stmt->fetch()) {
		$results[] = ['id' => (int)$r->avtorid, 'name' => $r->name,
			'cnt' => (int)$r->cnt, 'local' => (bool)$r->islocal, 'sim' => round((float)$r->sim, 3)];
	}
	addbook_json(['results' => $results]);
}

// ---------------------------------------------------------------------------
// AJAX: check whether a title already exists (exact and similar matches)
// ---------------------------------------------------------------------------
if ($url->action === 'titlecheck') {
	if (!$addbook_db_ok) addbook_json(['error' => 'maintenance'], 503);
	$q = trim((string)($_GET['q'] ?? ''));
	if (mb_strlen($q) < 2) addbook_json(['results' => []]);
	$stmt = $dbh->prepare("SELECT b.bookid, b.title, b.year, trim(b.filetype) AS filetype,
			(lower(b.title) = lower(:q1)) AS exact,
			similarity(b.title, :q2) AS sim,
			(SELECT string_agg(trim(concat_ws(' ', an.lastname, an.firstname)), ', ')
			 FROM libavtor la JOIN libavtorname an USING(avtorid) WHERE la.bookid = b.bookid) AS authors
		FROM libbook b
		WHERE b.deleted = '0' AND (lower(b.title) = lower(:q3) OR b.title % :q4)
		ORDER BY exact DESC, sim DESC
		LIMIT 10");
	$stmt->execute([':q1' => $q, ':q2' => $q, ':q3' => $q, ':q4' => $q]);
	$results = [];
	$hasExact = false;
	while ($r = $stmt->fetch()) {
		if ($r->exact) $hasExact = true;
		$results[] = ['id' => (int)$r->bookid, 'title' => $r->title, 'year' => (int)$r->year,
			'filetype' => $r->filetype, 'authors' => (string)$r->authors, 'exact' => (bool)$r->exact];
	}
	addbook_json(['results' => $results, 'exact' => $hasExact]);
}

// ---------------------------------------------------------------------------
// POST /addbook/create — validate everything and create the book
// ---------------------------------------------------------------------------
if ($url->action === 'create' && $_SERVER['REQUEST_METHOD'] === 'POST') {
	$inspect = null;
	do {
		if (!validate_csrf_token($_POST['csrf_token'] ?? '')) {
			$addbook_errors[] = 'Ошибка проверки CSRF-токена, обновите страницу';
			break;
		}
		if (!$addbook_db_ok) {
			$addbook_errors[] = 'Библиотека на техобслуживании, попробуйте позже';
			break;
		}

		// -- title
		$title = trim((string)($_POST['title'] ?? ''));
		if ($title === '' || mb_strlen($title) > 254) {
			$addbook_errors[] = 'Название книги обязательно (до 254 символов)';
			break;
		}

		// -- metadata
		$lang = strtolower(trim((string)($_POST['lang'] ?? 'ru')));
		if (!preg_match('/^[a-z]{2,3}$/', $lang)) {
			$addbook_errors[] = 'Язык: 2–3 латинские буквы (например ru, en)';
			break;
		}
		$year = (int)($_POST['year'] ?? 0);
		if ($year < 0 || $year > 2100) {
			$addbook_errors[] = 'Некорректный год';
			break;
		}
		$genres = [];
		foreach ((array)($_POST['genres'] ?? []) as $g) {
			if (ctype_digit((string)$g)) $genres[] = (int)$g;
		}
		$genres = array_slice(array_unique($genres), 0, 10);
		if (count($genres) > 0) {
			$in = implode(',', $genres);
			$chk = $dbh->query("SELECT COUNT(*) cnt FROM libgenrelist WHERE genreid IN ($in)");
			if ((int)$chk->fetch()->cnt !== count($genres)) {
				$addbook_errors[] = 'Выбран несуществующий жанр';
				break;
			}
		}

		// -- authors
		$authorsRaw = json_decode((string)($_POST['authors_json'] ?? '[]'), true);
		if (!is_array($authorsRaw) || count($authorsRaw) < 1 || count($authorsRaw) > 10) {
			$addbook_errors[] = 'Укажите от одного до десяти авторов';
			break;
		}
		$authors = [];  // ['id'=>int] or ['new'=>[last,first,middle,nick]]
		foreach ($authorsRaw as $a) {
			if (isset($a['id'])) {
				$aid = (int)$a['id'];
				$chk = $dbh->prepare("SELECT 1 FROM libavtorname WHERE avtorid = ?");
				$chk->execute([$aid]);
				if (!$chk->fetch()) {
					$addbook_errors[] = "Автор с id $aid не найден";
					break 2;
				}
				$authors[] = ['id' => $aid];
			} else {
				$last   = trim((string)($a['last'] ?? ''));
				$first  = trim((string)($a['first'] ?? ''));
				$middle = trim((string)($a['middle'] ?? ''));
				$nick   = trim((string)($a['nick'] ?? ''));
				if (($last === '' && $nick === '') || mb_strlen($last) > 99 || mb_strlen($first) > 99
						|| mb_strlen($middle) > 99 || mb_strlen($nick) > 33) {
					$addbook_errors[] = 'У нового автора должна быть фамилия или псевдоним (в пределах допустимой длины)';
					break 2;
				}
				$authors[] = ['new' => [$last, $first, $middle, $nick]];
			}
		}

		// -- file upload
		if (!isset($_FILES['bookfile']) || !is_array($_FILES['bookfile'])) {
			$addbook_errors[] = 'Файл книги не был передан';
			break;
		}
		$upErr = $_FILES['bookfile']['error'];
		if ($upErr !== UPLOAD_ERR_OK) {
			$addbook_errors[] = ($upErr === UPLOAD_ERR_INI_SIZE || $upErr === UPLOAD_ERR_FORM_SIZE)
				? 'Файл слишком велик для загрузки' : "Ошибка загрузки файла (код $upErr)";
			break;
		}
		if (!is_uploaded_file($_FILES['bookfile']['tmp_name'])) {
			$addbook_errors[] = 'Некорректная загрузка файла';
			break;
		}

		// -- format detection (incl. zip unwrap / epub / docx)
		$inspect = addbook_inspect_upload($_FILES['bookfile']['tmp_name'], (string)$_FILES['bookfile']['name']);
		if (!$inspect['ok']) {
			$addbook_errors[] = $inspect['error'];
			break;
		}
		$ext = $inspect['ext'];
		if (!in_array($ext, ADDBOOK_SUPPORTED_FORMATS, true)) {
			$addbook_errors[] = "Формат $ext не поддерживается";
			break;
		}
		$payload = $inspect['path'];
		$md5hex = md5_file($payload);
		$filesize = filesize($payload);

		// -- hard duplicate: identical file already in the library
		$chk = $dbh->prepare("SELECT bookid, title FROM libbook
			WHERE md5 = decode(:h1, 'hex') OR md5 = convert_to(:h2, 'UTF8') LIMIT 1");
		$chk->execute([':h1' => $md5hex, ':h2' => $md5hex]);
		if ($dup = $chk->fetch()) {
			$addbook_errors[] = "Этот файл уже есть в библиотеке: «" . $dup->title . "» (id " . $dup->bookid . ")";
			break;
		}

		// -- soft duplicate: same title needs explicit confirmation
		if (empty($_POST['confirm_duplicate'])) {
			$chk = $dbh->prepare("SELECT b.bookid, b.title,
					(SELECT string_agg(trim(concat_ws(' ', an.lastname, an.firstname)), ', ')
					 FROM libavtor la JOIN libavtorname an USING(avtorid) WHERE la.bookid = b.bookid) AS authors
				FROM libbook b WHERE lower(b.title) = lower(:t) AND b.deleted = '0' LIMIT 5");
			$chk->execute([':t' => $title]);
			$addbook_dup_titles = $chk->fetchAll();
			if (count($addbook_dup_titles) > 0) {
				$addbook_errors[] = 'Книга с таким названием уже есть в библиотеке. Отметьте «Всё равно добавить», если это другая книга.';
				break;
			}
		}

		// -- create everything in one transaction; zip written before commit
		$zipPath = null;
		try {
			$dbh->beginTransaction();

			$bookid = (int)$dbh->query("SELECT nextval('local_book_id_seq')")->fetchColumn();

			// NB: libbook."time" must be truncated to whole seconds — dump rows
			// have second precision and the display code parses that exact shape.
			// The column default (CURRENT_TIMESTAMP) would carry microseconds.
			$st = $dbh->prepare("INSERT INTO local_books (bookid, title, lang, year, filetype, filesize, md5, added_at)
				VALUES (:id, :t, :l, :y, :ft, :fs, decode(:md5, 'hex'), date_trunc('second', CURRENT_TIMESTAMP))");
			$st->execute([':id' => $bookid, ':t' => $title, ':l' => $lang, ':y' => $year,
				':ft' => $ext, ':fs' => $filesize, ':md5' => $md5hex]);

			$st = $dbh->prepare("INSERT INTO libbook (bookid, filesize, title, title1, lang, filetype, year, fileauthor, keywords, md5, \"time\")
				VALUES (:id, :fs, :t, '', :l, :ft, :y, '', '', decode(:md5, 'hex'), date_trunc('second', CURRENT_TIMESTAMP))");
			$st->execute([':id' => $bookid, ':fs' => $filesize, ':t' => $title, ':l' => $lang,
				':ft' => $ext, ':y' => $year, ':md5' => $md5hex]);

			$st = $dbh->prepare("INSERT INTO libbook_ts (bookid, vector)
				VALUES (:id, to_tsvector('russian', :t)) ON CONFLICT DO NOTHING");
			$st->execute([':id' => $bookid, ':t' => $title]);

			$pos = 0;
			foreach ($authors as $a) {
				if (isset($a['new'])) {
					[$last, $first, $middle, $nick] = $a['new'];
					$aid = (int)$dbh->query("SELECT nextval('local_author_id_seq')")->fetchColumn();
					$st = $dbh->prepare("INSERT INTO local_authors (avtorid, lastname, firstname, middlename, nickname)
						VALUES (:id, :l, :f, :m, :n)");
					$st->execute([':id' => $aid, ':l' => $last, ':f' => $first, ':m' => $middle, ':n' => $nick]);
					$st = $dbh->prepare("INSERT INTO libavtorname (avtorid, lastname, firstname, middlename, nickname, email, homepage)
						VALUES (:id, :l, :f, :m, :n, '', '')");
					$st->execute([':id' => $aid, ':l' => $last, ':f' => $first, ':m' => $middle, ':n' => $nick]);
					$st = $dbh->prepare("INSERT INTO libavtorname_ts (avtorid, vector)
						VALUES (:id, to_tsvector('russian', :nm)) ON CONFLICT DO NOTHING");
					$st->execute([':id' => $aid, ':nm' => trim("$last $middle $first $nick")]);
				} else {
					$aid = $a['id'];
				}
				$st = $dbh->prepare("INSERT INTO local_book_authors (bookid, avtorid, pos) VALUES (:b, :a, :p)");
				$st->execute([':b' => $bookid, ':a' => $aid, ':p' => $pos]);
				$st = $dbh->prepare("INSERT INTO libavtor (bookid, avtorid, pos) VALUES (:b, :a, :p)");
				$st->execute([':b' => $bookid, ':a' => $aid, ':p' => $pos]);
				$pos++;
			}

			foreach ($genres as $g) {
				$st = $dbh->prepare("INSERT INTO local_book_genres (bookid, genreid) VALUES (:b, :g)");
				$st->execute([':b' => $bookid, ':g' => $g]);
				$st = $dbh->prepare("INSERT INTO libgenre (bookid, genreid) VALUES (:b, :g)");
				$st->execute([':b' => $bookid, ':g' => $g]);
			}

			// package the file and register it for the range lookup
			[$zipPath, $usrFlag] = addbook_package($bookid, $ext, $payload);
			$st = $dbh->prepare("INSERT INTO book_zip (filename, start_id, end_id, usr) VALUES (:fn, :s, :e, :u)");
			$st->execute([':fn' => $zipPath, ':s' => $bookid, ':e' => $bookid, ':u' => $usrFlag]);

			$dbh->commit();

			// The runtime resolves book id -> archive from /cache/book_zip.php, so
			// refresh it now; otherwise the new book would not be downloadable
			// until the next import/reindex.
			book_zip_file_regenerate_from_db($dbh);
			// New book visible to everyone: drop cached pages and fragments.
			cache_clear_all();
		} catch (Throwable $e) {
			if ($dbh->inTransaction()) $dbh->rollBack();
			if ($zipPath !== null) @unlink($zipPath);
			error_log("addbook: create failed: " . $e->getMessage());
			$addbook_errors[] = 'Внутренняя ошибка при создании книги, подробности в логе сервера';
			break;
		}

		// cleanup wrapper-zip temp dir
		if (!empty($inspect['tmpdir'])) {
			@unlink($inspect['path']);
			@rmdir($inspect['tmpdir']);
		}

		header("Location: $webroot/addbook?added=$bookid");
		exit;
	} while (false);

	// error fallthrough: cleanup temp dir and render the form with errors
	if (is_array($inspect) && !empty($inspect['tmpdir'])) {
		@unlink($inspect['path']);
		@rmdir($inspect['tmpdir']);
	}
}
