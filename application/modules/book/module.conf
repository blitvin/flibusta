<?php
global $url, $book, $dbh;


try {
	$book = book_meta($dbh, intval($url->var1));
} catch (Exception $e) {
	$protocol = (isset($_SERVER['SERVER_PROTOCOL']) ? $_SERVER['SERVER_PROTOCOL'] : 'HTTP/1.0');
        header($protocol . ' 504 Gateway Time-out');

	// The driver message can carry the SQL text — log it, show a fixed message.
	error_log('book/module.conf: book lookup failed: ' . $e->getMessage());
	echo "<div class='card m-3 border-danger'><div class='card-header bg-danger'>База данных</div><div class='card-body'>";
	echo "<h3>Не удалось получить данные книги</h3>";
	echo "<p>Попробуйте упростить параметры поиска, убрать часть тэгов, направленность. Сервер маленький ^^.</p>";
	echo "</div></div>";
}


if (isset($book->bookid)) {
	$url->title = $book->title;

	if (isset($_SESSION['user_id'])) {
		$uid = intval($_SESSION['user_id']);
		$bid = intval($book->bookid);
		// Reading one fb2 costs two requests - the page and the sandboxed content
		// iframe - and paging back and forth through a book repeats them, so this
		// used to write the same row over and over. The marker is write-dedup only:
		// user_settings stays the source of truth, get_login_redirect() reads it
		// from there, and without Redis the upsert simply happens as before.
		$lastBookKey = "user:$uid:last_book";
		if (cache_get($lastBookKey) !== $bid) {
			$stmt = $dbh->prepare("INSERT INTO user_settings (user_id, last_book) VALUES (?, ?)
				ON CONFLICT (user_id) DO UPDATE SET last_book = EXCLUDED.last_book");
			$stmt->execute([$uid, $bid]);
			cache_set($lastBookKey, $bid, 86400);
		}
	}
}

// /book/content/<id> serves the book's own (untrusted) markup as a standalone
// sandboxed document for the iframe in index.php. It renders and exits here,
// before renderer.php would wrap it in the site chrome.
if ($url->action === 'content') {
	include(__DIR__ . '/content.php');
}

